<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fundo Circular escuro (slate-800) -->
  <circle cx="50" cy="50" r="46" fill="#1e293b" stroke="rgba(6, 182, 212, 0.3)" stroke-width="2"/>
  
  <!-- Detalhe do aro superior (simulando o spinner cyan-400) -->
